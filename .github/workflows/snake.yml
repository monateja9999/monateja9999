name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Generates the snake game from your contributions graph
      - uses: Platane/snk@v3
        with:
          # Tell the Action EXACTLY whose graph to grab
          github_user_name: monateja9999
          outputs: dist/github-contribution-grid-snake.svg
          
      # Pushes the generated svg to the 'output' branch
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
